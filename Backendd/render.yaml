services:
  - type: web
    name: django-app
    runtime: python
    build:
    commands:
      - pip install -r requirements.txt
      - python manage.py collectstatic --noinput
    startCommand: gunicorn your_project_name.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: Backendd.settings
      - key: PYTHON_VERSION
        value: 3.11
